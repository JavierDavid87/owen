
<div class="upload-panel">
    <h3>Add Academic Work</h3>
    <p>Select a category, enter a title, and choose a file.</p>

    <form id="upload-form">
        <label for="upload-category">Category</label>
        <select id="upload-category" required>
            <option value="quiz">Quiz</option>
            <option value="long-quiz">Long Quiz</option>
            <option value="midterms">Midterms</option>
            <option value="finals">Finals</option>
            <option value="activities">Activities</option>
            <option value="projects">Projects</option>
        </select>

        <label for="upload-title">File title</label>
        <input
            id="upload-title"
            type="text"
            placeholder="Example: Quiz 1"
            required
        >

        <label for="upload-file">Choose image or document</label>
        <input
            id="upload-file"
            type="file"
            accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt"
            required
        >

        <button class="primary-button" type="submit">Upload File</button>
        <p id="upload-message" role="status"></p>
    </form>
</div>
